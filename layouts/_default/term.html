<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | {{ .Site.Title }}</title>

  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>

<body>

  <main class="term-page">
    <h1>{{ .Title }}</h1>

    <ul class="post-list">
      {{ range .Pages }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          <small class="post-list-date">{{ .Date.Format "01-02-2006" }}</small>
        </li>
      {{ end }}
    </ul>

    <p class="home-link">
      <a href="{{ .Site.Home.RelPermalink }}">← Home</a>
    </p>
  </main>

</body>
</html>
