<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <h1 class="post-title">{{ .Title }}</h1>

{{ with .Params.subtitle }}
  <p class="post-subtitle">{{ . }}</p>
{{ end }}
　<p class="post-date">{{ .Date.Format "January 2, 2006" }}</p>
  
  {{ .Content }}

{{ with .Params.tags }}
  <p class="post-tags">
    Tags:
    {{ range . }}
      <a href="{{ (printf "/tags/%s/" (. | urlize)) | relURL }}">{{ . }}</a>
    {{ end }}
  </p>
{{ end }}
  
<p class="home-link">
  <a href="{{ .Site.Home.RelPermalink }}">← Home</a>
</p>
</body>
</html>
